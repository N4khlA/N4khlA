      <stop offset="0" stop-color="#d93a12" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d93a12" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0f0f10"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="820" width="380" height="320" fill="url(#glow)"/>

  <path d="M32 56V32h24" fill="none" stroke="#d93a12" stroke-width="2"/>
  <path d="M1168 264v24h-24" fill="none" stroke="#d93a12" stroke-width="2"/>

