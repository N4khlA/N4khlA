    <text x="896" y="204" fill="#7f7f7a" font-size="11" letter-spacing="1">CLASS OF 2027</text>

    <line x1="56" y1="252" x2="1144" y2="252" stroke="#2a2a2e"/>
    <text x="56" y="284" fill="#8b8b86" font-size="11" letter-spacing="1.6">SUBJECT  GUERFI AHMED YACINE</text>
    <text x="600" y="284" fill="#8b8b86" font-size="11" letter-spacing="1.6" text-anchor="middle">ESI-SBA · CYBER SECURITY ENGINEERING</text>
