    <line x1="56" y1="62" x2="1144" y2="62" stroke="#2a2a2e"/>

    <text x="56" y="146" font-size="58" font-weight="700" letter-spacing="1">
      <tspan fill="#f4f1ea">BUILD. </tspan><tspan fill="#d93a12">BREAK. </tspan><tspan fill="#f4f1ea">PROVE.</tspan>
    </text>
    <text x="56" y="184" fill="#c9c6bd" font-size="17" letter-spacing="0.4">Offensive security · Applied ML · Mobile AppSec</text>
    <text x="56" y="212" fill="#7f7f7a" font-size="14">I build the vulnerable system, exploit it, then prove the fix.</text>

    <rect x="872" y="106" width="272" height="116" fill="#141416" stroke="#2f2f33"/>
