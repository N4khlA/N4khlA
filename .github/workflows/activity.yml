name: Activity log

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4d4d&color_dots=#161b22,#561414,#8f1f1f,#c93333,#ff4d4d

      - name: Render contribution grid and languages card
        run: python3 scripts/activity.py dist
        env:
          # optional ACTIVITY_TOKEN (your own PAT) also counts private contributions
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "activity.log refreshed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
